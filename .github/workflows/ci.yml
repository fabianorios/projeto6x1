name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install MCP
        run: npm ci
        working-directory: mcp

      - name: Test MCP (SQL guard)
        run: npm test
        working-directory: mcp

      - name: Typecheck MCP
        run: npm run typecheck
        working-directory: mcp

      - name: Build MCP
        run: npm run build
        working-directory: mcp
